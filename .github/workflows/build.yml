name: Next.js Build Package

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Create Production Package
        run: |
          mkdir production-package
          cp -r .next/standalone production-package/
          cp -r .next/static production-package/.next/
          cp -r public production-package/