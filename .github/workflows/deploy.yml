name: Deploy Next.js to VM

on:
  push:
    branches:
      - newdesign   # change if you want main or newdesign

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Create temporary swap
            sudo fallocate -l 2G /swapfile2
            sudo chmod 600 /swapfile2
            sudo mkswap /swapfile2
            sudo swapon /swapfile2

            # Navigate to app
            cd /var/www/production_new_port/next-comfygen-ssr-custom-express-2

            # Pull latest code
            git fetch --all
            git reset --hard origin/newdesign

            # Build with extended memory
            export NODE_OPTIONS="--max-old-space-size=3072"
            npm ci
            nice -n -20 npm run build

            # Restart pm2
            pm2 restart all

            # Cleanup swap
            sudo swapoff /swapfile2
            sudo rm -f /swapfile2
